name: Deploy backend

# Il ramo di questo repository è master, non main.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  # Necessario per ottenere il token OIDC con cui assumere il ruolo su AWS:
  # nessuna access key di lunga durata conservata nei secrets di GitHub.
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assumi il ruolo AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push dell'immagine
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker build -t "$IMAGE" -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$IMAGE"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # L'aggiornamento passa da SSM e non da SSH: nessuna porta 22 aperta e
      # nessuna chiave privata da conservare su GitHub.
      - name: Aggiorna l'istanza via SSM
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy backend ${{ github.sha }}" \
            --parameters commands="[\"/opt/receipthub/update.sh backend $IMAGE\"]" \
            --query "Command.CommandId" --output text)
          echo "Comando SSM: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "{stato:Status, uscita:StandardOutputContent, errori:StandardErrorContent}" --output json
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
          test "$STATUS" = "Success"
