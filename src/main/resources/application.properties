spring.application.name=BackendSDCC
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.jpa.hibernate.ddl-auto=create

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/my-test-realm
logging.level.org.springframework.security=TRACE

# Jackson - Instant serialization (ISO-8601)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

#------------PDF Genration properties---------------------
table_noOfColumns=4
table.columnNames=Product Code, Product Name, Quantity, Price Cad., Price Tot.

aws.s3.bucket-name=il-tuo-bucket
aws.s3.region=eu-west-1
aws.s3.access-key=YOUR_ACCESS_KEY
aws.s3.secret-key=YOUR_SECRET_KEY