spring.application.name=BackendSDCC
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/backendsdcc_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sdcc}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sdcc_pass}
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=update
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# In produzione vale /api: Caddy manda lì le chiamate all'API e tutto il resto
# al frontend, che vivono sullo stesso dominio senza collisioni di percorso
# (/receipts è una pagina del frontend, /api/receipt/... e' il backend).
# Vuoto in locale, dove il backend risponde direttamente sulla 8080.
server.servlet.context-path=${SERVER_CONTEXT_PATH:}

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp


# Jackson - Instant serialization (ISO-8601)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

#------------PDF Genration properties---------------------
table_noOfColumns=5
table.columnNames=Product Code, Product Name, Quantity, Price Cad., Price Tot.

# Nessuna credenziale qui: le prende DefaultCredentialsProvider (vedi S3Config).
aws.s3.bucket-name=${AWS_S3_BUCKET:backendsdcc-dev-files-001-094028239135-eu-north-1-an}
aws.s3.region=${AWS_S3_REGION:eu-north-1}


# Firebase Authentication
firebase.project-id=${FIREBASE_PROJECT_ID:sdcc-a2df9}

# Origine ammessa dal CORS: in produzione il dominio pubblico del frontend.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
# A DEBUG Spring Security scrive nei log i dettagli dei token di ogni richiesta:
# va bene in locale mentre si lavora sull'autenticazione, non in produzione.
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}

#------------Chatbot (Spring AI + OpenAI)-----------------
# La chiave non sta qui: arriva dall'ambiente (in produzione dal .env sull'istanza,
# come POSTGRES_PASSWORD). Il default "missing" serve solo a far partire
# l'applicazione senza chiave: in quel caso il chatbot risponde 503 e tutto il
# resto del backend funziona normalmente.
spring.ai.openai.api-key=${OPENAI_API_KEY:missing}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-5-mini}

# La famiglia gpt-5 accetta SOLO temperature=1: Spring AI di suo manderebbe 0.7
# e OpenAI risponderebbe 400 "Unsupported value: temperature". Non togliere
# questa riga senza cambiare anche il modello.
spring.ai.openai.chat.options.temperature=1.0

# Se un tool solleva un'eccezione, il messaggio torna al modello invece di far
# fallire la richiesta. I tool la gestiscono comunque al loro interno: questo
# resta come rete di sicurezza.
spring.ai.tools.throw-exception-on-error=false

# Tetto di domande al giorno per utente: /chat e' l'unico endpoint che costa a
# ogni chiamata, e senza un limite un utente autenticato puo' consumare in ciclo
# i crediti OpenAI dell'applicazione. Il conteggio e' per istanza e in memoria
# (vedi ChatRateLimiter).
app.chat.max-domande-giornaliere=${CHAT_MAX_DOMANDE_GIORNALIERE:30}
