spring.application.name=BackendSDCC
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/backendsdcc_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sdcc}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sdcc_pass}
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=update
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# In produzione vale /api: Caddy manda lì le chiamate all'API e tutto il resto
# al frontend, che vivono sullo stesso dominio senza collisioni di percorso
# (/receipts è una pagina del frontend, /api/receipt/... e' il backend).
# Vuoto in locale, dove il backend risponde direttamente sulla 8080.
server.servlet.context-path=${SERVER_CONTEXT_PATH:}

spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp


# Jackson - Instant serialization (ISO-8601)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

#------------PDF Genration properties---------------------
table_noOfColumns=5
table.columnNames=Product Code, Product Name, Quantity, Price Cad., Price Tot.

# Nessuna credenziale qui: le prende DefaultCredentialsProvider (vedi S3Config).
aws.s3.bucket-name=${AWS_S3_BUCKET:backendsdcc-dev-files-001-094028239135-eu-north-1-an}
aws.s3.region=${AWS_S3_REGION:eu-north-1}


# Firebase Authentication
firebase.project-id=${FIREBASE_PROJECT_ID:sdcc-a2df9}

# Origine ammessa dal CORS: in produzione il dominio pubblico del frontend.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
logging.level.org.springframework.security=DEBUG
